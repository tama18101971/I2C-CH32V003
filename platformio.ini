; Unified PlatformIO Configuration for I2C-CH32V003
; Allows building all examples and benchmarks directly from the repository root.

[platformio]
default_envs = scanner, benchmark_full, benchmark_no_recovery, benchmark_no_error_counter, benchmark_no_buffer, benchmark_lite

[env]
platform = ch32v
board = genericCH32V003F4P6
framework = noneos-sdk
lib_extra_dirs = .

; === Examples ===
[env:scanner]
build_src_filter = -<*> +<../examples/i2c_scanner/src/main.c>
monitor_speed = 115200

; === Size Benchmarks ===
[env:benchmark_full]
build_src_filter = -<*> +<../examples/size_benchmark/src/main.c>

[env:benchmark_no_recovery]
build_src_filter = -<*> +<../examples/size_benchmark/src/main.c>
build_flags = -DI2C_DISABLE_BUS_RECOVERY

[env:benchmark_no_error_counter]
build_src_filter = -<*> +<../examples/size_benchmark/src/main.c>
build_flags = -DI2C_DISABLE_ERROR_COUNTER

[env:benchmark_no_buffer]
build_src_filter = -<*> +<../examples/size_benchmark/src/main.c>
build_flags = -DI2C_DISABLE_BUFFER_API

[env:benchmark_lite]
build_src_filter = -<*> +<../examples/size_benchmark/src/main.c>
build_flags = -DI2C_LITE=1
