; Unified PlatformIO Configuration for I2C-CH32V003
; Allows building all examples and benchmarks directly from the repository root.

[platformio]
default_envs =
    scanner
    benchmark_full
    benchmark_no_recovery
    benchmark_no_error_counter
    benchmark_no_buffer
    benchmark_lite
    allapi_full
    allapi_no_buffer
    allapi_no_scanner
    allapi_lite

[env]
platform = https://github.com/Community-PIO-CH32V/platform-ch32v.git
board = genericCH32V003F4P6
framework = noneos-sdk
lib_extra_dirs = .
; Link-time optimization: measured -152..-692 B of Flash depending on the profile.
; Enabled here for every environment; consumers of the library are encouraged to
; set the same flag in their own project.
board_build.use_lto = yes

; === Examples ===
[env:scanner]
build_src_filter = -<*> +<../examples/i2c_scanner/src/main.c>
monitor_speed = 115200

; === Size benchmarks: typical sensor application (register API only) ===
[env:benchmark_full]
build_src_filter = -<*> +<../examples/size_benchmark/src/main.c>

[env:benchmark_no_recovery]
build_src_filter = -<*> +<../examples/size_benchmark/src/main.c>
build_flags = -DI2C_DISABLE_BUS_RECOVERY

[env:benchmark_no_error_counter]
build_src_filter = -<*> +<../examples/size_benchmark/src/main.c>
build_flags = -DI2C_DISABLE_ERROR_COUNTER

[env:benchmark_no_buffer]
build_src_filter = -<*> +<../examples/size_benchmark/src/main.c>
build_flags = -DI2C_DISABLE_BUFFER_API

[env:benchmark_lite]
build_src_filter = -<*> +<../examples/size_benchmark/src/main.c>
build_flags = -DI2C_LITE=1

; === Size benchmarks: every public API entry point referenced ===
[env:allapi_full]
build_src_filter = -<*> +<../examples/size_benchmark/src/main_allapi.c>

[env:allapi_no_buffer]
build_src_filter = -<*> +<../examples/size_benchmark/src/main_allapi.c>
build_flags = -DI2C_DISABLE_BUFFER_API

[env:allapi_no_scanner]
build_src_filter = -<*> +<../examples/size_benchmark/src/main_allapi.c>
build_flags = -DI2C_DISABLE_SCANNER

[env:allapi_lite]
build_src_filter = -<*> +<../examples/size_benchmark/src/main_allapi.c>
build_flags = -DI2C_LITE=1

; === Reference builds without LTO (for comparison in CI reports) ===
[env:nolto_full]
build_src_filter = -<*> +<../examples/size_benchmark/src/main.c>
board_build.use_lto = no

[env:nolto_lite]
build_src_filter = -<*> +<../examples/size_benchmark/src/main.c>
build_flags = -DI2C_LITE=1
board_build.use_lto = no
