; Minimal size benchmark for I2C-CH32V003.
; It deliberately has no UART, printf, or scanner output so the reported
; firmware size is dominated by the SDK startup code and the selected I2C API.

[platformio]
default_envs = full, no_recovery, no_error_counter, no_buffer, lite

[env]
platform = ch32v
board = genericCH32V003F4P6
framework = noneos-sdk
lib_deps =
    symlink://../..

[env:full]

[env:no_recovery]
build_flags = -DI2C_DISABLE_BUS_RECOVERY

[env:no_error_counter]
build_flags = -DI2C_DISABLE_ERROR_COUNTER

[env:no_buffer]
build_flags = -DI2C_DISABLE_BUFFER_API

[env:lite]
build_flags = -DI2C_LITE=1
