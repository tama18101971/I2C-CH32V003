name: CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  unit-tests:
    name: Host unit tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        config:
          - ""
          - "-DI2C_ATOMIC_CRITICAL=1"
          - "-DI2C_LEGACY_STATUS=1"
          - "-DI2C_TIMEOUT_MS=5"
          - "-DI2C_DISABLE_ERROR_COUNTER"
          - "-DI2C_DISABLE_BUS_RECOVERY"
          - "-DI2C_DISABLE_BUFFER_API"
          - "-DI2C_DISABLE_SCANNER"
          - "-DI2C_LITE=1"
          - "-DI2C_LITE=1 -DI2C_ATOMIC_CRITICAL=1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and run driver state-machine tests
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p test/build
          g++ ${{ matrix.config }} \
            -std=c++11 -O1 -g -Wall -Wextra -Werror \
            -Itest/mock -Isrc -Itest \
            -x c++ src/i2c.c \
            -x c++ test/i2c_mock.cpp \
            -x c++ test/test_i2c.cpp \
            -o test/build/test_i2c

          ./test/build/test_i2c

  build:
    name: Build - ${{ matrix.environment }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        environment:
          - scanner
          - benchmark_full
          - benchmark_no_recovery
          - benchmark_no_error_counter
          - benchmark_no_buffer
          - benchmark_lite
          - allapi_full
          - allapi_no_buffer
          - allapi_no_scanner
          - allapi_lite
          - nolto_full
          - nolto_lite

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            platformio-${{ runner.os }}-

      - name: Install PlatformIO
        run: |
          pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build
        run: pio run -e ${{ matrix.environment }}

      - name: Calculate memory usage
        id: size
        shell: bash
        run: |
          set -euo pipefail

          ELF_FILE=".pio/build/${{ matrix.environment }}/firmware.elf"
          if [ ! -f "$ELF_FILE" ]; then
            echo "ERROR: ELF file not found: $ELF_FILE"
            exit 1
          fi

          SIZE_TOOL=$(find "$HOME/.platformio/packages/toolchain-riscv/bin" -name '*-size' | head -n 1)
          if [ -z "$SIZE_TOOL" ]; then
            echo "ERROR: riscv size tool not found"
            exit 1
          fi

          # Размер считается суммой секций, а не колонками text/data из вывода
          # GNU size: секция .vector имеет атрибут ALLOC без LOAD (не попадает в
          # text, но присутствует в firmware.bin), а .stack размещён в RAM и не
          # входит в bss. Сумма по секциям совпадает и с размером .bin, и с
          # отчётом PlatformIO.
          SECTIONS=$("$SIZE_TOOL" -A "$ELF_FILE")
          echo "$SECTIONS"

          FLASH_USED=$(awk '$1 ~ /^\.(init|vector|text|fini|data|highcode)$/ { s += $2 } END { print s+0 }' <<< "$SECTIONS")
          RAM_USED=$(awk   '$1 ~ /^\.(data|bss|stack)$/                      { s += $2 } END { print s+0 }' <<< "$SECTIONS")

          # Ёмкость памяти берётся из манифеста платы, а не парсингом текста
          BOARD=$(awk -F'=' '/^[[:space:]]*board[[:space:]]*=/ { gsub(/[[:space:]]/, "", $2); print $2; exit }' platformio.ini)
          FLASH_TOTAL=$(pio boards "$BOARD" --json-output | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["rom"])')
          RAM_TOTAL=$(pio boards "$BOARD" --json-output | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["ram"])')

          if [ "$FLASH_USED" -eq 0 ] || [ "$RAM_USED" -eq 0 ] || [ -z "$FLASH_TOTAL" ] || [ -z "$RAM_TOTAL" ]; then
            echo "ERROR: failed to determine memory usage"
            exit 1
          fi

          # Контроль согласованности: сумма секций обязана совпасть с firmware.bin
          BIN_FILE=".pio/build/${{ matrix.environment }}/firmware.bin"
          if [ -f "$BIN_FILE" ]; then
            BIN_SIZE=$(stat -c%s "$BIN_FILE")
            if [ "$BIN_SIZE" != "$FLASH_USED" ]; then
              echo "ERROR: section sum ($FLASH_USED) != firmware.bin size ($BIN_SIZE)"
              exit 1
            fi
          fi

          RAM_PERCENT=$(awk "BEGIN{printf \"%.1f%%\", $RAM_USED * 100 / $RAM_TOTAL}")
          FLASH_PERCENT=$(awk "BEGIN{printf \"%.1f%%\", $FLASH_USED * 100 / $FLASH_TOTAL}")

          echo "environment=${{ matrix.environment }}" >> "$GITHUB_OUTPUT"
          echo "ram_percent=$RAM_PERCENT" >> "$GITHUB_OUTPUT"
          echo "ram_used=$RAM_USED" >> "$GITHUB_OUTPUT"
          echo "ram_total=$RAM_TOTAL" >> "$GITHUB_OUTPUT"
          echo "flash_percent=$FLASH_PERCENT" >> "$GITHUB_OUTPUT"
          echo "flash_used=$FLASH_USED" >> "$GITHUB_OUTPUT"
          echo "flash_total=$FLASH_TOTAL" >> "$GITHUB_OUTPUT"

      - name: Create size report
        shell: bash
        run: |
          cat > "size-report-${{ matrix.environment }}.md" << EOF
          | Environment | Flash | Flash % | RAM | RAM % |
          |---|---:|---:|---:|---:|
          | ${{ steps.size.outputs.environment }} | ${{ steps.size.outputs.flash_used }} / ${{ steps.size.outputs.flash_total }} bytes | ${{ steps.size.outputs.flash_percent }} | ${{ steps.size.outputs.ram_used }} / ${{ steps.size.outputs.ram_total }} bytes | ${{ steps.size.outputs.ram_percent }} |
          EOF

      - name: Upload size report
        uses: actions/upload-artifact@v4
        with:
          name: size-report-${{ matrix.environment }}
          path: size-report-${{ matrix.environment }}.md
          if-no-files-found: error

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - name: Download size reports
        uses: actions/download-artifact@v4
        with:
          pattern: size-report-*
          merge-multiple: true
          path: reports

      - name: Create GitHub Actions Summary
        shell: bash
        run: |
          echo "# I2C-CH32V003 Build Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Environment | Flash | Flash % | RAM | RAM % |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|---:|---:|---:|" >> "$GITHUB_STEP_SUMMARY"

          if compgen -G "reports/*.md" > /dev/null; then
            for file in reports/*.md; do
              tail -n +3 "$file" >> "$GITHUB_STEP_SUMMARY"
            done
          else
            echo "| No successful build reports available | - | - | - | - |" >> "$GITHUB_STEP_SUMMARY"
          fi
